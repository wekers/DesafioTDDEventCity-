name: iDaily Commit

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  beat:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PERSONAL_TOKEN }}

      - name: Setup Git
        run: |
          git config user.name "wekers"
          git config user.email "fernando@wekers.org"  

      - name: Make idaily update
        run: |
          echo "Daily: $(date -u)" > idaily.txt
          git add idaily.txt
          git commit -m "docs: idaily update $(date -u '+%Y-%m-%d')" || exit 0
          git push
