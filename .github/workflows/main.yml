name: iDaily Update

on:
  schedule:
    - cron: "0 12 * * *"  
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PERSONAL_TOKEN }}
          
      - name: Update timestamp
        run: |
          echo "<!-- Updated: $(date) -->" >> README.md
          git config user.name "wekers"
          git config user.email "fernando@wekers.org"
          git add README.md
          git commit -m "docs: update timestamp" || exit 0
          git push
