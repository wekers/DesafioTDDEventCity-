name: Daily Commit

on:
  schedule:
    - cron: "0 8 * * *"  # 05:00 Brasília
  workflow_dispatch:

jobs:
  beat:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PERSONAL_TOKEN }}
          ref: main  
      - name: Setup Git config
        run: |
          git config --global user.name "wekers"
          git config --global user.email "fernando@wekers.org"

      - name: Generate beat file
        run: |
          echo "Beat: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > abeat.txt

      - name: Commit and push
        run: |
          git add abeat.txt
          git commit -m "docs: update abeat - $(date -u '+%Y-%m-%d')" || exit 0
          git push origin main
