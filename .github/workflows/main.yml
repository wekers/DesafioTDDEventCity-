name: Daily Commit

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  beat:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PERSONAL_TOKEN }} 

      - name: Setup Git config
        run: |
          git config --global user.name "wekers"
          git config --global user.email "fernando@wekers.com"

      - name: Generate commit
        run: |
          echo "Beat: $(date)" > abeat.txt
          git add abeat.txt
          git commit -m "docs: update abeat - $(date '+%Y-%m-%d')"
          git push
